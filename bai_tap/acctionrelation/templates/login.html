{% extends "layout.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
    <h2>Đăng nhập hệ thống</h2>
    <form method="POST">
        <div class="form-group">
            <label>Tên đăng nhập:</label>
            <!-- Giữ lại giá trị username nếu nhập sai -->
            <input type="text" name="username" value="{{ username }}" required placeholder="Nhập tên đăng nhập...">
        </div>
        <div class="form-group">
            <label>Mật khẩu:</label>
            <input type="password" name="password" required placeholder="Nhập mật khẩu...">
        </div>
        <div class="form-group" style="display: flex; align-items: center;">
            <input type="checkbox" id="remember" name="remember" style="width: auto; margin-right: 8px; cursor: pointer;">
            <label for="remember" style="margin-bottom: 0; font-weight: normal; cursor: pointer;">Ghi nhớ đăng nhập</label>
        </div>
        <button type="submit">Đăng nhập</button>
    </form>
{% endblock %}
